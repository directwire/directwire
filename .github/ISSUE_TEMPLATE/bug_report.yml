name: Bug report
description: Something in the implementation misbehaves. If it is a security issue, use the private advisory instead.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Security issue?** Do not use this form — report privately via [Security Advisories](https://github.com/directwire/directwire/security/advisories)."
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      placeholder: Include the exact error output / panic message / log lines.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A test, a script, or a step-by-step. Loopback-only repros are best.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: e.g. v0.1, or the commit hash from `git rev-parse HEAD`.
    validations:
      required: true
  - type: dropdown
    id: feature
    attributes:
      label: Affected area
      options:
        - p2p-mesh relay
        - p2p-mesh hole punching / direct path
        - p2p-mesh path selection
        - p2p-mesh QUIC direct
        - gm-pq-stack handshake
        - gm-pq-stack transport
        - MCP integration
        - Other
    validations:
      required: true
