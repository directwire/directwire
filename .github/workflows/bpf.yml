name: xdp-bpf

# xdp-edge Linux 实机验证（#22）——在 ubuntu runner 的真内核上完成，
# 不依赖任何人的本机设备。
#
#   1. clang -target bpf 编译 xdp_edge.o（-Wall -Werror，验证器之前先过编译器）；
#   2. 挂到 veth 对的 XDP 钩子（加载 = 内核验证器接受程序）；
#   3. 注入自制 TCP SYN，断言收到 IPIP 封装后的 XDP_TX 转发包；
#   4. 限速归零 → 断言新源被 XDP_DROP 且 stats 计数增长；
#   5. ICMP ping PASS 路径旁证。
# 测试脚本: crates/xdp-edge/bpf/ci_datapath_test.py
#
# 诊断约定：匿名仓库日志/产物 403、API 限流，唯一可见通道是 run 页面上的
# ::error::/::notice:: 注解，故所有关键步骤都把实际错误文本打到注解里。

on:
  push:
    paths:
      - 'crates/xdp-edge/bpf/**'
      - '.github/workflows/bpf.yml'
  pull_request:
    paths:
      - 'crates/xdp-edge/bpf/**'
      - '.github/workflows/bpf.yml'
  workflow_dispatch:

jobs:
  dataplane:
    name: compile + load + datapath (veth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! sudo apt-get update >/tmp/aptu.log 2>&1; then
            echo "::error::apt-get update failed"
            tail -6 /tmp/aptu.log | sed 's/^/::error::/' || true
            exit 1
          fi
          # linux-libc-dev 提供 Makefile -I 路径所需的 UAPI 头；勿用
          # linux-headers-$(uname -r)（版本耦合且装在 /usr/src）。
          # libelf-dev / zlib1g-dev 是 bpftool 源码构建的依赖。
          for p in clang llvm libbpf-dev iproute2 linux-libc-dev libelf-dev zlib1g-dev; do
            if ! sudo apt-get install -y --no-install-recommends "$p" >/tmp/apt.log 2>&1; then
              echo "::error::apt install failed for package: $p"
              grep -m2 -E "E:|Unable|has no installation candidate" /tmp/apt.log | sed 's/^/::error::/' || true
              exit 1
            fi
          done
          # runner 镜像预装了一个 linux-tools 包装脚本（/usr/sbin/bpftool），
          # 版本相关的真二进制缺失 → `version` 直接失败并提示装 linux-tools-*。
          # 统一以全路径 /usr/local/bin/bpftool 为准：既绕开 bash 把命令名哈希
          # 到坏包装的缓存，也绕开包装脚本对 PATH 的抢占；不行才源码构建装过去。
          # 后续步骤（sudo python3 测试、bpftool prog show）都在新 shell 里按
          # PATH 解析，/usr/local/bin 排在 /usr/sbin 前，天然取到好二进制。
          if ! /usr/local/bin/bpftool version >/dev/null 2>&1; then
            echo "::notice::no usable bpftool — building from source (libbpf/bpftool v7.7.0)"
            git clone --depth 1 --branch v7.7.0 https://github.com/libbpf/bpftool /tmp/bpftool >/dev/null 2>&1 || {
              echo "::error::bpftool clone failed"; exit 1; }
            git -C /tmp/bpftool submodule update --init --recursive >/dev/null 2>&1 || {
              echo "::error::bpftool submodule init failed"; exit 1; }
            make -C /tmp/bpftool/src -j"$(nproc)" >/tmp/bpftool_build.log 2>&1 || {
              echo "::error::bpftool build failed"
              tail -10 /tmp/bpftool_build.log | sed 's/^/::error::/' || true
              exit 1; }
            sudo cp /tmp/bpftool/src/bpftool /usr/local/bin/bpftool
            hash -r
          fi
          if ! /usr/local/bin/bpftool version 2>/tmp/bpftool_ver.err; then
            echo "::error::bpftool (/usr/local/bin) version still failing"
            tail -20 /tmp/bpftool_ver.err | sed 's/^/::error::/' || true
            exit 1
          fi
          echo "bpftool: $(/usr/local/bin/bpftool version 2>/dev/null | head -1)"
          echo "clang: $(clang --version 2>/dev/null | head -1 || echo MISSING)"
          echo "::notice::deps installed + bpftool runnable"

      - name: Compile xdp_edge.o (clang -target bpf, -Wall -Werror)
        run: |
          rc=0
          make -C crates/xdp-edge/bpf >/tmp/make.log 2>&1 || rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::make failed (exit $rc)"
            tail -40 /tmp/make.log | sed 's/^/::error::/' || true
            exit $rc
          fi
          echo "::notice::xdp_edge.o compiled clean (-Wall -Werror)"

      - name: Inspect object
        run: |
          rc=0
          { file crates/xdp-edge/bpf/xdp_edge.o; llvm-objdump -h crates/xdp-edge/bpf/xdp_edge.o; } >/tmp/inspect.log 2>&1 || rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::inspect failed (exit $rc)"
            tail -20 /tmp/inspect.log | sed 's/^/::error::/' || true
            exit $rc
          fi
          cat /tmp/inspect.log

      - name: Datapath test (attach + forward + rate-drop + stats)
        run: |
          rc=0
          sudo python3 crates/xdp-edge/bpf/ci_datapath_test.py >/tmp/dp.log 2>&1 || rc=$?
          # 测试的 ::warning::（如 veth adjust_head quirk 说明）只有在步骤的实时输出里
          # 才会被 runner 解析成注解；成功路径若不透传就不可见，这里显式放行。
          grep -E '^::(warning|notice)::' /tmp/dp.log || true
          if [ $rc -ne 0 ]; then
            echo "::error::datapath test failed (exit $rc)"
            tail -40 /tmp/dp.log | sed 's/^/::error::/' || true
            exit $rc
          fi
          echo "::notice::datapath test PASS"

      - name: Loaded program / attach info
        if: always()
        run: |
          bpftool prog show 2>/dev/null | head -20 || true
          bpftool net show 2>/dev/null || true
