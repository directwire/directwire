name: xdp-bpf

# xdp-edge Linux 实机验证（#22）——在 ubuntu runner 的真内核上完成，
# 不依赖任何人的本机设备。
#
#   1. clang -target bpf 编译 xdp_edge.o（-Wall -Werror，验证器之前先过编译器）；
#   2. 挂到 veth 对的 XDP 钩子（加载 = 内核验证器接受程序）；
#   3. 注入自制 TCP SYN，断言收到 IPIP 封装后的 XDP_TX 转发包；
#   4. 限速归零 → 断言新源被 XDP_DROP 且 stats 计数增长；
#   5. ICMP ping PASS 路径旁证。
# 测试脚本: crates/xdp-edge/bpf/ci_datapath_test.py

on:
  push:
    paths:
      - 'crates/xdp-edge/bpf/**'
      - '.github/workflows/bpf.yml'
  pull_request:
    paths:
      - 'crates/xdp-edge/bpf/**'
      - '.github/workflows/bpf.yml'
  workflow_dispatch:

jobs:
  dataplane:
    name: compile + load + datapath (veth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # apt failures surface as ::error:: annotations (visible on the run
          # page without log access). linux-libc-dev supplies the UAPI headers
          # at /usr/include/x86_64-linux-gnu that the Makefile's -I path needs;
          # linux-headers-$(uname -r) is version-coupled and installs to
          # /usr/src, not that path.
          if ! sudo apt-get update >/tmp/aptu.log 2>&1; then
            echo "::error::apt-get update failed"
            tail -6 /tmp/aptu.log | sed 's/^/::error::/' || true
            exit 1
          fi
          # 说明：bpftool 在这版 runner 的 Ubuntu 上没有独立 apt 包
          # （"no installation candidate"）；linux-tools-generic 又内核版本
          # 耦合不稳。改为从官方 libbpf/bpftool 源码构建（确定性、无版本
          # 耦合）。libelf-dev / zlib1g-dev 是 bpftool 的构建依赖。
          for p in clang llvm libbpf-dev iproute2 linux-libc-dev libelf-dev zlib1g-dev; do
            if ! sudo apt-get install -y --no-install-recommends "$p" >/tmp/apt.log 2>&1; then
              echo "::error::apt install failed for package: $p"
              grep -m2 -E "E:|Unable|has no installation candidate" /tmp/apt.log | sed 's/^/::error::/' || true
              exit 1
            fi
          done
          if ! command -v bpftool >/dev/null 2>&1; then
            echo "::notice::building bpftool from source (libbpf/bpftool v7.7.0)"
            git clone --depth 1 --branch v7.7.0 https://github.com/libbpf/bpftool /tmp/bpftool >/dev/null 2>&1 || {
              echo "::error::bpftool clone failed"; exit 1; }
            git -C /tmp/bpftool submodule update --init --recursive >/dev/null 2>&1 || {
              echo "::error::bpftool submodule init failed"; exit 1; }
            make -C /tmp/bpftool/src -j"$(nproc)" >/tmp/bpftool_build.log 2>&1 || {
              echo "::error::bpftool build failed"
              tail -10 /tmp/bpftool_build.log | sed 's/^/::error::/' || true
              exit 1; }
            sudo cp /tmp/bpftool/src/bpftool /usr/local/bin/bpftool
            echo "::notice::bpftool installed (source build)"
          fi
          bpftool version || echo "::error::bpftool still not runnable"
          echo "::notice::deps installed: clang llvm libbpf-dev iproute2 linux-libc-dev libelf-dev zlib1g-dev + bpftool"

      - name: Compile xdp_edge.o (clang -target bpf, -Wall -Werror)
        run: make -C crates/xdp-edge/bpf

      - name: Inspect object
        run: |
          file crates/xdp-edge/bpf/xdp_edge.o
          llvm-objdump -h crates/xdp-edge/bpf/xdp_edge.o

      - name: Datapath test (attach + forward + rate-drop + stats)
        run: sudo python3 crates/xdp-edge/bpf/ci_datapath_test.py

      - name: Loaded program / attach info
        if: always()
        run: |
          bpftool prog show 2>/dev/null | head -20 || true
          bpftool net show 2>/dev/null || true
