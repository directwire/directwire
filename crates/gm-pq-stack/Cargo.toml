[package]
name = "gm-pq-stack"
version = "0.1.0"
edition = "2024"
description = "SM2 + ML-KEM-768 hybrid KEM handshake and secure transport stack (national-crypto compliance + post-quantum readiness)"
license = "Apache-2.0 OR MulanPSL-2.0"

[dependencies]
# National-crypto algorithm family: SM2 / SM3 / SM4-GCM (pure Rust, per GB/T standards)
libsmx = "0.3"
# RustCrypto's FIPS 203 ML-KEM implementation (the getrandom feature provides injection-free
# RNG wrappers / keygen interfaces; the zeroize feature zeroizes ML-KEM decapsulation keys on drop)
ml-kem = { version = "0.3", features = ["getrandom", "zeroize"] }
# libsmx uses rand_core 0.6's RngCore; ml-kem goes through getrandom, so no rand_core 0.10 needed
rand_core_06 = { package = "rand_core", version = "0.6" }
getrandom = "0.4"
# Key hygiene: session/shared secrets are zeroized automatically when they leave scope
zeroize = "1"
